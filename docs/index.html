<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášky na šachové turnaje</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container home">
    <header class="hero">
      <h1 id="site-name">Přihlášky na šachové turnaje</h1>
      <p class="muted">Vyberte akci, na kterou se chcete přihlásit.</p>
    </header>
    <div id="loader" class="loader-card card" role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Načítám turnaje…<br><span class="small muted">První načtení může trvat několik sekund.</span></span>
    </div>
    <p id="status" class="muted" hidden></p>
    <div id="toolbar" class="home-toolbar" hidden>
      <div class="seg" role="group" aria-label="Zobrazení">
        <button type="button" data-view="list" aria-pressed="true">Seznam</button>
        <button type="button" data-view="calendar" aria-pressed="false">Kalendář</button>
      </div>
      <label id="search-wrap" class="home-search" hidden><span class="hp">Hledat akci</span>
        <input id="search" type="search" placeholder="Hledat akci, místo nebo turnaj…" autocomplete="off"></label>
    </div>
    <div id="legend" class="legend" hidden></div>
    <div id="events"></div>
    <footer class="footer links" id="footer" hidden><a href="ochrana-udaju.html" class="muted">Zpracování osobních údajů</a>
      <a href="klub.html" class="muted">Klubová sekce</a>
      <a href="admin.html" class="muted">Přihlášení pro pořadatele</a></footer>
  </main>
  <script src="js/api.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/picker.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
