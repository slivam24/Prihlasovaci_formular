# Sestaví a nasadí formulář na GitHub Pages.
# Při každém sestavení stáhne aktuální listinu LOK z elo.miramal.com a převede ji
# na data/players.json, takže našeptávač je vždy aktuální (spouští se i každý den).
name: Web a listina LOK

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # každý den ve 3:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testy
        run: node --test tests/*.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install xlrd==2.0.1

      - id: pages
        uses: actions/configure-pages@v5

      - name: Přehled listin na elo.miramal.com (dočasně, zjištění rapid LOK)
        continue-on-error: true
        run: |
          for u in https://elo.miramal.com/ https://elo.miramal.com/download/; do
            echo "== $u"
            curl -fsSL -m 30 "$u" | grep -oiE 'href="[^"]+"' | sort -u | head -100 || true
          done
          for f in lok_sm_cz_rapid.xls lok_sm_rapid_cz.xls lok_rapid_sm_cz.xls lokr_sm_cz.xls lok_sm_cz_r.xls rapid_sm_cz.xls lok_sm_cz_blitz.xls; do
            echo "$f: $(curl -s -o /dev/null -w '%{http_code}' -m 20 https://elo.miramal.com/download/$f)"
          done

      - name: Stáhnout a převést listinu LOK
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if ! python scripts/convert_lok.py --download docs/data/players.json; then
            echo "::warning::Listinu LOK se nepodařilo stáhnout, použije se poslední nasazená verze."
            curl -fsSL "$PAGES_URL/data/players.json" -o docs/data/players.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
