# Nahraje backend (apps-script/) do Google Apps Script a aktualizuje stávající nasazení,
# takže adresa /exec v docs/config.json zůstává stejná.
#
# Potřebné nastavení v GitHubu (Settings → Secrets and variables → Actions):
#   secret   CLASPRC_JSON  – obsah ~/.clasprc.json po `clasp login` (viz README)
#   variable SCRIPT_ID     – (nebo secret) ID skriptu (Apps Script → Nastavení projektu → ID skriptu)
# ID nasazení se bere z apiUrl v docs/config.json (…/macros/s/<ID>/exec).
name: Backend (Apps Script)

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".github/workflows/apps-script.yml"
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testy
        run: node --test tests/*.test.js

      - name: Kontrola nastavení
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID || secrets.SCRIPT_ID }}
        run: |
          missing=""
          [ -z "$CLASPRC_JSON" ] && missing="$missing secret CLASPRC_JSON"
          [ -z "$SCRIPT_ID" ] && missing="$missing SCRIPT_ID (repository variable nebo secret)"
          if [ -n "$missing" ]; then
            echo "::warning::Backend se nenasadil, chybí:$missing (viz README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DEPLOYMENT_ID=$(node -e "const u=require('./docs/config.json').apiUrl||''; const m=u.match(/\/macros\/s\/([^/]+)\/exec/); process.stdout.write(m?m[1]:'')")
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::V docs/config.json chybí platná apiUrl (…/macros/s/<ID>/exec)."
            exit 1
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Přihlášení clasp
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ vars.SCRIPT_ID || secrets.SCRIPT_ID }}
        run: |
          # zalomení řádků z kopírování v terminálu – v JSONu ani v tokenech nemají co dělat
          printf '%s' "$CLASPRC_JSON" | tr -d '\r\n' > ~/.clasprc.json
          node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(!JSON.stringify(j).includes('refresh_token')) throw new Error('chybí refresh_token')" ~/.clasprc.json \
            || { echo "::error::Secret CLASPRC_JSON není platný JSON s refresh_token – vložte znovu celý výpis ~/.clasprc.json (viz README)."; exit 1; }
          printf '{"scriptId":"%s","rootDir":"apps-script"}' "$SCRIPT_ID" > .clasp.json
          npm install -g @google/clasp@3.4.1

      - name: Nahrát kód
        if: steps.check.outputs.ready == 'true'
        run: clasp push --force

      - name: Aktualizovat nasazení
        if: steps.check.outputs.ready == 'true'
        run: clasp update-deployment "${{ steps.check.outputs.deployment_id }}" --description "GitHub ${GITHUB_SHA::7}"
